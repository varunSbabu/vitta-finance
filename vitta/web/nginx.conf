# Vitta static frontend — mirrors what serve.py does for local dev
# without Docker: serve app.html at /, disable caching so a rebuild
# always wins, force UTF-8 on text/* so the rupee sign renders.
server {
    listen 5757 default_server;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index app.html;

    # Kill browser caching for now — the app is a single 335 KB file
    # that changes often. Once assets have content-hashed filenames
    # (Phase 3 frontend restructure), flip this to long-lived caching
    # on assets and short on the HTML.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # `/` -> the SPA entry file. The client-side hash router handles the
    # rest (routes are #/app, #/login, ...). No try_files fallback needed
    # since we never have real subpaths.
    location = / {
        try_files /app.html =404;
    }

    location = /app.html {
        try_files /app.html =404;
    }

    location = /vitta-mark.svg {
        try_files /vitta-mark.svg =404;
    }

    # Everything else 404s explicitly — no directory listings, no
    # accidental serving of files we didn't intend to expose.
    location / {
        return 404;
    }
}
