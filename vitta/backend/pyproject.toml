[project]
name = "vitta-backend"
version = "0.5.0"
description = "Vitta API — FastAPI + SQLite expense-analytics backend."
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn[standard]==0.39.0",
    "pdfplumber==0.11.8",
    "python-multipart==0.0.20",
    "requests==2.32.5",
    "authlib==1.6.12",
    "itsdangerous==2.2.0",
    "python-dotenv==1.2.1",
    "httpx==0.28.1",
    "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.16.6",
    "mypy==1.19.1",
    "types-requests",
    "pre-commit==4.3.0",
    "detect-secrets==1.5.0",
]

# This project is run from source (uvicorn main:app), not installed as a
# wheel — no [build-system] table on purpose. pyproject.toml here is the
# single source of truth for pinned versions (see requirements-lock.txt,
# generated from this) and for all [tool.*] config below.

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    # FastAPI's on_event startup hook is deprecated in favor of lifespan
    # handlers; tracked as backend tech debt, not a test failure.
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:main",
]

[tool.ruff]
target-version = "py39"
line-length = 110
extend-exclude = [".venv", "vitta.db"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line length — handled by the formatter, not worth failing CI over yet
]

[tool.ruff.lint.isort]
known-first-party = ["routes", "parsers"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^test_.*\\.py$"]
