# Render.com web service for the Vitta FastAPI backend (free plan).
# Free instances sleep after ~15 min idle; the first request after that
# takes up to about a minute while the instance starts.
#
# The browser never calls this service directly: vitta/vercel.json
# proxies /api/* from the Vercel site to it, so cookies stay first-party.
# The settings below mirror what to enter when creating the service by
# hand in the Render dashboard (see deploy/README.md).

services:
  - type: web
    name: vitta-api
    runtime: docker
    plan: free
    rootDir: vitta/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: VITTA_ENV
        value: prod
      - key: PUBLIC_BASE_URL
        value: https://vitta-finance.vercel.app
      - key: FRONTEND_URL
        value: https://vitta-finance.vercel.app/#/app
      - key: ALLOWED_ORIGINS
        value: https://vitta-finance.vercel.app
      - key: EMAIL_BACKEND
        value: log
      # Set these as secrets in the Render dashboard, never in this file:
      #   SESSION_SECRET_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
      #   GROQ_API_KEY, ADMIN_EMAIL
