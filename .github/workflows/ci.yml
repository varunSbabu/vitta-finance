name: CI

# Runs on every push to any branch and on every PR to main. Concurrency
# ensures a second push to the same branch cancels the older run so a
# stack of commits doesn't burn CI minutes twice.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only for the whole workflow; individual jobs elevate
# only when needed.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vitta/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vitta/backend/requirements-lock.txt

      - name: Install runtime + dev deps
        # The full lock includes ruff/mypy/pytest/pre-commit — that's
        # what CI actually needs. On 3.12 the dev-tool transitives
        # resolve cleanly (only the older 3.9 base of the local .venv
        # had the filelock/virtualenv conflict).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Ruff — lint
        run: ruff check .

      - name: Ruff — format check
        run: ruff format --check .

      - name: Pytest
        run: pytest

  secrets:
    name: detect-secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"

      - name: Scan against baseline
        # New (unbaselined) hits fail this step. Regenerate the baseline
        # locally if a false positive is expected: run
        #   vitta/.venv/bin/detect-secrets scan vitta/ [--exclude-files ...] > .secrets.baseline
        # and commit the updated file.
        run: |
          detect-secrets scan --baseline .secrets.baseline \
            --exclude-files 'vitta/\.venv/.*' \
            --exclude-files 'vitta/backend/vitta\.db$' \
            --exclude-files '.*\.pyc$' \
            --exclude-files '__pycache__' \
            --exclude-files 'vitta/backend/requirements-lock\.txt$'

  docker:
    name: Docker — build both images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only build images on main + PRs — every dev push doesn't need a
    # 3-minute Docker layer build.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./vitta/backend
          file: ./vitta/backend/Dockerfile
          push: false
          load: true
          tags: vitta-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./vitta
          file: ./vitta/web/Dockerfile
          push: false
          load: true
          tags: vitta-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — api container starts and answers /api/health
        run: |
          docker run -d --name vitta-api-smoke -p 8001:8001 vitta-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8001/api/health; then
              echo ""; echo "api healthy"; exit 0
            fi
            sleep 1
          done
          echo "api did not become healthy in time"
          docker logs vitta-api-smoke
          exit 1
